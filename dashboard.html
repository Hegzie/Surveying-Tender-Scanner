<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveying Tender Scanner</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e3e6eb;
    --text: #1c2128;
    --text-dim: #5c6570;
    --accent: #1a56db;
    --badge-qld: #7c3aed;
    --badge-au: #0f766e;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: 2rem 1.25rem 4rem;
  }

  .wrap { max-width: 900px; margin: 0 auto; }

  header { margin-bottom: 1.75rem; }

  h1 { font-size: 1.6rem; letter-spacing: -0.01em; margin-bottom: 0.3rem; }

  .subtitle { color: var(--text-dim); font-size: 0.95rem; }

  #meta {
    margin-top: 0.9rem;
    font-size: 0.85rem;
    color: var(--text-dim);
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.4rem 1.5rem;
    margin-bottom: 1rem;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 0.6rem;
  }

  .card h2 {
    font-size: 1.05rem;
    font-weight: 650;
    line-height: 1.35;
  }

  .badge {
    flex-shrink: 0;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    color: white;
    white-space: nowrap;
  }

  .badge.qld_qtenders { background: var(--badge-qld); }
  .badge.austender { background: var(--badge-au); }

  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.5rem 1.5rem;
    font-size: 0.87rem;
    color: var(--text-dim);
    margin-bottom: 0.8rem;
  }

  .fields b { color: var(--text); font-weight: 600; }

  .summary {
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-bottom: 0.9rem;
  }

  .card a.link {
    display: inline-block;
    font-size: 0.87rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }

  .card a.link:hover { text-decoration: underline; }

  #empty, #error {
    color: var(--text-dim);
    padding: 2rem 0;
    text-align: center;
  }

  #error { color: #b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Surveying Tender Scanner</h1>
    <p class="subtitle">Open, surveying-related government tenders in QLD and federally.</p>
    <div id="meta"></div>
  </header>

  <div id="results"></div>
</div>

<script>
const SOURCE_LABEL = { qld_qtenders: "QLD", austender: "Federal" };

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
}

async function load() {
  const metaEl = document.getElementById("meta");
  const resultsEl = document.getElementById("results");

  let data;
  try {
    const res = await fetch("data/tenders.json", { cache: "no-store" });
    data = await res.json();
  } catch (e) {
    resultsEl.innerHTML = '<div id="error">Couldn\'t load tender data (data/tenders.json).</div>';
    return;
  }

  const generated = new Date(data.generated_at);
  metaEl.innerHTML = `
    <span>Last updated: ${generated.toLocaleString("en-AU")}</span>
    <span>${data.count} open tender${data.count === 1 ? "" : "s"} found</span>
  `;

  if (!data.tenders || data.tenders.length === 0) {
    resultsEl.innerHTML = '<div id="empty">No open surveying-related tenders right now. Check back tomorrow.</div>';
    return;
  }

  resultsEl.innerHTML = data.tenders.map(t => `
    <div class="card">
      <div class="card-top">
        <h2>${t.title}</h2>
        <span class="badge ${t.source}">${SOURCE_LABEL[t.source] || t.source}</span>
      </div>
      <div class="fields">
        <div><b>Agency:</b> ${t.agency || "—"}</div>
        <div><b>Region:</b> ${t.region || "—"}</div>
        <div><b>Closes:</b> ${fmtDate(t.closes)}</div>
      </div>
      ${t.summary ? `<div class="summary">${t.summary}</div>` : ""}
      ${t.link ? `<a class="link" href="${t.link}" target="_blank" rel="noopener">View tender →</a>` : ""}
    </div>
  `).join("");
}

load();
</script>
</body>
</html>
